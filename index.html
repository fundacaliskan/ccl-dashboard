<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCL Event Analytics Dashboard</title>
<style>
:root{--green:#1a7a4c;--green-l:#e8f5ee;--blue:#2563eb;--ink:#1a2b23;--mut:#5c6b63;--bg:#f6f8f7;--card:#fff;--bd:#e2e8e5;--flag:#c0392b;--watch:#b7791f;--pos:#1a7a4c;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:linear-gradient(135deg,#1a7a4c,#12603b);color:#fff;padding:26px 32px}
header h1{font-size:22px;font-weight:700}
header p{opacity:.9;font-size:13px;margin-top:4px}
.tabs{display:flex;flex-wrap:wrap;gap:2px;background:#fff;border-bottom:1px solid var(--bd);padding:0 16px;position:sticky;top:0;z-index:10}
.tab{padding:13px 16px;cursor:pointer;font-size:13px;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--green);border-bottom-color:var(--green)}
.panel{display:none;padding:24px 32px;max-width:1180px;margin:0 auto}
.panel.active{display:block}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);font-weight:600}
.kpi .val{font-size:30px;font-weight:700;margin-top:6px}
.kpi .sub{font-size:12px;color:var(--mut);margin-top:2px}
h2{font-size:16px;margin:26px 0 12px;font-weight:700}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin-bottom:10px;font-weight:700}
.funnel{display:flex;gap:10px;flex-wrap:wrap}
.fstep{flex:1;min-width:120px;background:var(--green-l);border-radius:10px;padding:14px;text-align:center}
.fstep .n{font-size:26px;font-weight:700;color:var(--green)}
.fstep .t{font-size:12px;color:var(--mut);margin-top:2px}
.bar{height:8px;background:#eef2f0;border-radius:6px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--green)}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd);font-size:13px}
.row:last-child{border:0}
.sig{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:8px;border-left:3px solid}
.sig.flag{background:#fdecea;border-color:var(--flag)}
.sig.watch{background:#fef6e7;border-color:var(--watch)}
.sig.positive{background:var(--green-l);border-color:var(--pos)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--bd)}
th{background:#f0f4f2;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
td.n,th.n{text-align:right}
.pill{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;margin-right:3px}
.pill.flag{background:#fdecea;color:var(--flag)}
.pill.watch{background:#fef6e7;color:var(--watch)}
.pill.positive{background:var(--green-l);color:var(--pos)}
select{padding:8px 12px;border:1px solid var(--bd);border-radius:8px;font-size:13px;background:#fff}
canvas{width:100%!important;max-width:100%}
.chartwrap{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.btn{padding:7px 14px;border:1px solid var(--bd);background:#fff;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;color:var(--green)}
.btn:hover{background:var(--green-l)}
.two{grid-template-columns:1fr 1fr}
@media(max-width:760px){.two{grid-template-columns:1fr}.panel{padding:18px}}
.muted{color:var(--mut);font-size:12px}
</style>
</head>

<script>
var DB = JSON.parse(document.getElementById('ccl-data').textContent);
var EV = DB.events.slice().sort(function(a,b){return a.month<b.month?-1:a.month>b.month?1:0;});
var TYPES=['Small Group Networking','Speaker Series','Snackable Skills','Workshop'];
var TABS=['Latest Event','Monthly View','SGN Trend','Speaker Trend','Snackable Trend','Type Benchmarks','All Events'];

function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function pct(x){return x==null?'-':x.toFixed(1)+'%';}
function num(x){return x==null?'-':x;}

// build tabs
var tabsEl=document.getElementById('tabs'),panelsEl=document.getElementById('panels');
TABS.forEach(function(name,i){
  var t=el('div','tab'+(i===0?' active':''),name);t.onclick=function(){select(i);};tabsEl.appendChild(t);
  var p=el('div','panel'+(i===0?' active':''));p.id='panel-'+i;panelsEl.appendChild(p);
});
function select(i){
  var ts=tabsEl.children,ps=panelsEl.children;
  for(var k=0;k<ts.length;k++){ts[k].classList.toggle('active',k===i);ps[k].classList.toggle('active',k===i);}
  if(i===2)drawTrend('Small Group Networking','panel-2');
  if(i===3)drawTrend('Speaker Series','panel-3');
  if(i===4)drawTrend('Snackable Skills','panel-4');
}

document.getElementById('hdr-sub').textContent=EV.length+' events tracked  |  '+EV[0].date+' \u2013 '+EV[EV.length-1].date+'  |  updated '+(DB.pipeline.last_updated||'');

// ---------- Latest Event ----------
function attrRows(e){
  var entries=Object.keys(e.attribution||{}).map(function(k){return [k,e.attribution[k]];}).sort(function(a,b){return b[1]-a[1];});
  var tot=entries.reduce(function(s,x){return s+x[1];},0)||1;
  return entries.map(function(x){return '<div class="row"><span>'+x[0]+'</span><span>'+x[1]+' <span class="muted">('+(x[1]/tot*100).toFixed(0)+'%)</span></span></div>';}).join('');
}
function roleRows(e){return (e.top_roles||[]).map(function(r){return '<div class="row"><span>'+r[0]+'</span><span>'+r[1]+'</span></div>';}).join('');}
function sigBlocks(e){return (e.signals||[]).map(function(s){return '<div class="sig '+s.type+'">'+s.text+'</div>';}).join('')||'<p class="muted">No signals flagged.</p>';}

function latestPanel(){
  var e=EV[EV.length-1],p=document.getElementById('panel-0');
  var totRet=(e.first_timers+e.returning_2_4+e.returning_5plus)||1;
  p.innerHTML=
  '<h2>'+e.name+' &nbsp;<span class="muted" style="font-size:13px">'+e.type+' \u00b7 '+e.date+'</span></h2>'+
  '<div class="grid kpis">'+
    kpi('Registrations',e.registrations,'of '+e.total_invites+' invited')+
    kpi('Attendance',pct(e.attendance_rate),e.attended+' attended')+
    kpi('Satisfaction',e.avg_rating!=null?e.avg_rating.toFixed(2):'-',(e.rating_responses||0)+' ratings')+
    kpi('Catalyst Intent',pct(e.catalyst_rate),(e.catalyst_yes||0)+' said yes')+
  '</div>'+
  '<h2>Funnel</h2><div class="funnel">'+
    fstep('Invited',e.total_invites,100)+
    fstep('Registered',e.registrations,e.registrations/e.total_invites*100)+
    fstep('Attended',e.attended,e.attended/e.total_invites*100)+
  '</div>'+
  '<div class="grid two" style="margin-top:20px">'+
    '<div class="card"><h3>Retention Mix</h3>'+
      retRow('First-timers',e.first_timers,totRet)+retRow('Returning 2\u20134',e.returning_2_4,totRet)+retRow('Loyalists 5+',e.returning_5plus,totRet)+'</div>'+
    '<div class="card"><h3>Top Roles</h3>'+roleRows(e)+'</div>'+
  '</div>'+
  '<div class="grid two" style="margin-top:16px">'+
    '<div class="card"><h3>Attribution</h3>'+attrRows(e)+'</div>'+
    '<div class="card"><h3>Signals</h3>'+sigBlocks(e)+'</div>'+
  '</div>';
}
function kpi(l,v,s){return '<div class="card kpi"><div class="lbl">'+l+'</div><div class="val">'+v+'</div><div class="sub">'+s+'</div></div>';}
function fstep(t,n,w){return '<div class="fstep"><div class="n">'+n+'</div><div class="t">'+t+'</div><div class="bar"><i style="width:'+w.toFixed(0)+'%"></i></div></div>';}
function retRow(l,n,tot){var w=(n/tot*100);return '<div class="row"><span>'+l+'</span><span>'+n+' <span class="muted">('+w.toFixed(0)+'%)</span></span></div><div class="bar" style="margin-bottom:8px"><i style="width:'+w.toFixed(0)+'%"></i></div>';}

// ---------- Monthly View ----------
function monthlyPanel(){
  var p=document.getElementById('panel-1');
  var months=[];EV.forEach(function(e){if(months.indexOf(e.month)<0)months.push(e.month);});
  var sel=el('select');months.slice().reverse().forEach(function(m){var o=el('option');o.value=m;o.textContent=EV.filter(function(e){return e.month===m;})[0].date;sel.appendChild(o);});
  var out=el('div');out.style.marginTop='16px';
  function render(m){
    var evs=EV.filter(function(e){return e.month===m;});
    out.innerHTML=evs.map(function(e){
      return '<div class="card" style="margin-bottom:14px"><h2 style="margin-top:0">'+e.name+'</h2>'+
      '<div class="grid kpis">'+kpi('Regs',e.registrations,'of '+e.total_invites)+kpi('Attendance',pct(e.attendance_rate),e.attended+' came')+
      kpi('Satisfaction',e.avg_rating!=null?e.avg_rating.toFixed(2):'-',(e.rating_responses||0)+' ratings')+kpi('Catalyst',pct(e.catalyst_rate),(e.catalyst_yes||0)+' yes')+'</div>'+
      '<div style="margin-top:12px">'+sigBlocks(e)+'</div></div>';
    }).join('');
  }
  sel.onchange=function(){render(sel.value);};
  p.appendChild(el('h2',null,'Monthly View'));p.appendChild(sel);p.appendChild(out);render(months[months.length-1]);
}

// ---------- Trend charts ----------
var showAll={};
function drawTrend(type,pid){
  var p=document.getElementById(pid);
  var evs=EV.filter(function(e){return e.type===type;});
  p.innerHTML='';
  p.appendChild(el('h2',null,type+' Trend'));
  var all=!!showAll[type];
  var data=all?evs:evs.slice(-6);
  var btn=el('button','btn',all?'Show last 6':'Show all events');
  btn.onclick=function(){showAll[type]=!all;drawTrend(type,pid);};
  p.appendChild(btn);
  [['Registrations','registrations',false],['Attendance rate','attendance_rate',true],['Satisfaction','avg_rating',false]].forEach(function(m){
    var w=el('div','chartwrap');w.appendChild(el('h3',null,m[0]));
    var cv=el('canvas');cv.height=200;w.appendChild(cv);p.appendChild(w);
    lineChart(cv,data.map(function(e){return e.date;}),data.map(function(e){return e[m[1]];}),m[2]);
  });
  if(!data.length)p.appendChild(el('p','muted','No events of this type yet.'));
}
function lineChart(cv,labels,vals,isPct){
  var ctx=cv.getContext('2d');var W=cv.width=cv.offsetWidth*2;var H=cv.height=400;ctx.scale(1,1);
  var pad=44,pr=2;ctx.clearRect(0,0,W,H);
  var clean=vals.map(function(v){return v==null?null:v;});
  var mx=Math.max.apply(null,clean.filter(function(v){return v!=null;}).concat([1]));
  var mn=0;var span=mx-mn||1;
  var gx=function(i){return pad+(W-pad*1.4-pad)*(labels.length<2?0.5:i/(labels.length-1));};
  var gy=function(v){return H-pad-(H-pad*1.6)*((v-mn)/span);};
  ctx.strokeStyle='#e2e8e5';ctx.lineWidth=1;ctx.fillStyle='#5c6b63';ctx.font='20px sans-serif';
  for(var g=0;g<=4;g++){var yv=mn+span*g/4;var y=gy(yv);ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W-pad*0.4,y);ctx.stroke();ctx.fillText((isPct?yv.toFixed(0)+'%':yv.toFixed(1)),4,y+6);}
  ctx.strokeStyle='#1a7a4c';ctx.lineWidth=3;ctx.beginPath();var started=false;
  clean.forEach(function(v,i){if(v==null)return;var x=gx(i),y=gy(v);if(!started){ctx.moveTo(x,y);started=true;}else ctx.lineTo(x,y);});
  ctx.stroke();
  clean.forEach(function(v,i){if(v==null)return;var x=gx(i),y=gy(v);var last=(i===clean.length-1);
    ctx.fillStyle='#1a7a4c';ctx.beginPath();ctx.arc(x,y,last?9:5,0,7);ctx.fill();
    if(last){ctx.fillStyle='#b7791f';ctx.font='24px sans-serif';ctx.fillText('\u2605',x-10,y-14);}
    ctx.fillStyle='#1a2b23';ctx.font='20px sans-serif';ctx.textAlign='center';ctx.fillText(isPct?v.toFixed(0)+'%':v,x,y-16);ctx.textAlign='left';
  });
  ctx.fillStyle='#5c6b63';ctx.font='18px sans-serif';ctx.textAlign='center';
  labels.forEach(function(l,i){ctx.fillText(l,gx(i),H-14);});ctx.textAlign='left';
}

// ---------- Benchmarks ----------
function benchPanel(){
  var p=document.getElementById('panel-5');var b=DB.benchmarks;
  var rows=TYPES.map(function(t){var d=b[t]||{};return '<tr><td><b>'+t+'</b></td><td class="n">'+num(d.events)+'</td><td class="n">'+num(d.avg_regs)+'</td><td class="n">'+pct(d.avg_att_rate)+'</td><td class="n">'+(d.avg_satisfaction!=null?d.avg_satisfaction:'-')+'</td><td class="n">'+(d.avg_catalyst_pct!=null?pct(d.avg_catalyst_pct):'-')+'</td></tr>';}).join('');
  p.innerHTML='<h2>Type Benchmarks</h2><div class="card"><table><thead><tr><th>Event Type</th><th class="n">Events</th><th class="n">Avg Regs</th><th class="n">Avg Attendance</th><th class="n">Avg Satisfaction</th><th class="n">Avg Catalyst</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
  '<h2>Community Pipeline</h2><div class="grid kpis">'+
   kpi('Unique People',DB.pipeline.total_unique_people,'across all events')+
   kpi('Unique Attendees',DB.pipeline.unique_attended,'ever attended')+
   kpi('Ever Said Yes',DB.pipeline.ever_said_yes,'Catalyst interest')+
   kpi('Reg Return Rate',pct(DB.retention.return_rate_registered_pct),DB.retention.returned_registered_count+' returned')+
   kpi('Loyalists 3+',DB.retention.loyalists_3plus,'attended 3+ events')+
  '</div><p class="muted" style="margin-top:10px">'+(DB.pipeline.notes||'')+'</p>';
}

// ---------- All Events ----------
function allPanel(){
  var p=document.getElementById('panel-6');
  var rows=EV.slice().reverse().map(function(e){
    var sp=(e.signals||[]).map(function(s){return '<span class="pill '+s.type+'">'+s.type+'</span>';}).join('');
    return '<tr><td>'+e.date+'</td><td>'+e.name+'</td><td>'+e.type+'</td><td class="n">'+e.registrations+'</td><td class="n">'+pct(e.attendance_rate)+'</td><td class="n">'+(e.avg_rating!=null?e.avg_rating.toFixed(1):'-')+'</td><td class="n">'+pct(e.catalyst_rate)+'</td><td>'+sp+'</td></tr>';
  }).join('');
  p.innerHTML='<h2>All Events</h2><div class="card"><table><thead><tr><th>Date</th><th>Event</th><th>Type</th><th class="n">Regs</th><th class="n">Att</th><th class="n">Sat</th><th class="n">Cat</th><th>Signals</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

latestPanel();monthlyPanel();benchPanel();allPanel();
window.addEventListener('resize',function(){var a=document.querySelector('.panel.active');if(a){var id=a.id;if(id==='panel-2')drawTrend('Small Group Networking',id);if(id==='panel-3')drawTrend('Speaker Series',id);if(id==='panel-4')drawTrend('Snackable Skills',id);}});
